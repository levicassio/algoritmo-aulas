<script>

    estado = window.prompt("Digite o estado:");
    valor = Number(window.prompt("Digite o valor:"));

    switch (estado) {

        case "SP":
            imposto = valor * 0.05;
            break;

        case "RJ":
            imposto = valor * 0.06;
            break;

        case "MG":
            imposto = valor * 0.07;
            break;

        default:
            imposto = valor * 0.04;
    }

    document.write("Valor do imposto: " + imposto);

</script>

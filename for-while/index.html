    for(i = 1; i <= 10; i++) {

</script>

<script>
    for (i = 0; i <= 20; i += 2) {
        document.write (i+ "")
    }
</script>

<script>
    for ( i = 10; i >= 1; i--) {
        document.write ( i+ "");
    }
</script>

<script>
    num = Number(window.prompt("Digite um número"));

    for (i = 1; i <= 10; i++) {
        document.write(num + " x " + i + " = " + (num * i) + "<br>");
    }
</script>

<script>
    i = 1
    while (i <= 5) {
        document.write( i+ "");
        i++;
    }
</script>

<script>
    for ( i = 2; i <= 50; i += 2) {
        document.write ( i+ "");
    }
</script>

<script>
    i = window.prompt("Digite um numero ");

    while ( i >= 0 ) {

        document.write( i+ "<br>");
        i--;
    }
</script>
